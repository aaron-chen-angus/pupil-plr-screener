<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f14" />
    <title>PLR Screener (Not a Diagnostic Device)</title>
    <link rel="stylesheet" href="./src/styles.css" />

    <!--
      BUILD-FREE ENTRY. This app runs directly from static files with native
      ES modules — no npm install, no bundler, no Node required. The import map
      resolves the MediaPipe bare specifier to the CDN over HTTPS. All local
      modules use relative "./app/*.js" paths so it works under a GitHub Pages
      project subpath.
    -->
    <script type="importmap">
      {
        "imports": {
          "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./app/main.js"></script>
  </body>
</html>
